<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FC Gì Nhỉ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0a0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FC Gì Nhỉ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="logic.js"></script>
<script src="seed.js"></script>
<style>
:root{
  --bg:#0a0b10; --bg2:#11131b; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --tx:#f3f1ee; --mu:#9a9eab; --mu2:#6c7080;
  --red:#8E1B30; --red2:#C3304E; --gold:#D9A441; --gold2:#F2C66B;
  --ok:#2FD58A; --no:#FF5C72; --warn:#FFB547;
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --num:'Chakra Petch',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Be Vietnam Pro',system-ui,-apple-system,sans-serif}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 85% -10%,rgba(142,27,48,.35),transparent 60%),
  radial-gradient(600px 400px at -10% 30%,rgba(217,164,65,.08),transparent 60%),var(--bg);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:32px 32px;mask-image:linear-gradient(#000,transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:560px;margin:0 auto;padding:calc(10px + var(--safe-t)) 14px calc(96px + var(--safe-b));position:relative}
/* header */
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
.top img{width:40px;height:40px;object-fit:contain;padding:4px;background:#fff;border-radius:11px;box-shadow:0 4px 14px rgba(195,48,78,.35)}
.brand{font-family:var(--num);font-weight:700;letter-spacing:.08em;font-size:17px;line-height:1}
.brand{white-space:nowrap}.top .pill b{max-width:92px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}.top{gap:8px}.top .pill{padding:6px 9px}
.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:.25em;margin-top:3px;font-weight:600}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--mu);white-space:nowrap}
.pill b{color:var(--tx);font-weight:600}
.pill.adm{border-color:rgba(217,164,65,.5);color:var(--gold2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
/* cards */
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;position:relative;overflow:hidden;backdrop-filter:blur(8px)}
.card.glow{border-color:rgba(195,48,78,.45);box-shadow:0 0 0 1px rgba(195,48,78,.15) inset,0 20px 50px -20px rgba(195,48,78,.45)}
.h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 4px 8px}
.h h2{margin:0;font-family:var(--num);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);font-weight:600}
.h h2:before{content:"";display:inline-block;width:14px;height:2px;background:var(--gold);vertical-align:middle;margin-right:8px;border-radius:2px}
.mu{color:var(--mu)} .mu2{color:var(--mu2)} .sm{font-size:12.5px} .xs{font-size:11px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px} .row.sb{justify-content:space-between} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/8.4;border:1px solid var(--line);margin-top:2px}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05) contrast(1.05);opacity:0;transition:opacity 1.2s ease;transform:scale(1.04)}
.hero img.on{opacity:1;animation:kb 6s ease-out forwards}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1.02)}}
.hero .dots{position:absolute;right:14px;bottom:16px;z-index:2;display:flex;gap:5px}
.hero .dots i{width:6px;height:6px;border-radius:9px;background:rgba(255,255,255,.35);transition:.3s}
.hero .dots i.on{width:18px;background:var(--gold2)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,16,0) 35%,rgba(10,11,16,.92)),linear-gradient(90deg,rgba(142,27,48,.35),transparent 60%)}
.hero .ht{position:absolute;left:16px;bottom:12px;right:16px;z-index:1}
.hero h1{margin:0;font-family:var(--num);font-size:30px;letter-spacing:.06em;line-height:1;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.hero .k{font-family:var(--num);font-size:11px;letter-spacing:.3em;color:var(--gold2);margin-bottom:6px}
/* next match */
.tag{font-family:var(--num);font-size:11px;letter-spacing:.2em;padding:4px 9px;border-radius:6px;background:rgba(195,48,78,.18);color:#ff8aa0;border:1px solid rgba(195,48,78,.4);font-weight:600}
.tag.g{background:rgba(217,164,65,.14);color:var(--gold2);border-color:rgba(217,164,65,.4)}
.tag.gr{background:rgba(255,255,255,.06);color:var(--mu);border-color:var(--line2)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:16px 0 6px;text-align:center}
.team b{display:block;font-size:14px;margin-top:8px;font-weight:600}
.crest{width:58px;height:58px;margin:0 auto;border-radius:16px;display:grid;place-items:center;background:#fff;border:1px solid var(--line)}
.crest img{width:40px;height:44px;object-fit:contain}
.crest.opp{font-family:var(--num);font-size:22px;color:var(--mu);background:#15171f repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 6px,transparent 6px 12px)}
.vsm{font-family:var(--num);font-size:13px;color:var(--mu2);letter-spacing:.2em}
.score{font-family:var(--num);font-size:40px;font-weight:700;letter-spacing:.04em;line-height:1}
.meta{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:var(--mu);font-size:13px;margin-top:4px}
.cd{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.cd div{min-width:54px;padding:8px 4px 6px;border-radius:12px;background:#07080c;border:1px solid var(--line);text-align:center}
.cd b{display:block;font-family:var(--num);font-size:24px;line-height:1;color:var(--gold2);text-shadow:0 0 14px rgba(242,198,107,.35)}
.cd span{font-size:9.5px;letter-spacing:.18em;color:var(--mu2);text-transform:uppercase}
.cdl{text-align:center;font-size:11px;letter-spacing:.22em;color:var(--mu);text-transform:uppercase;margin-top:12px;font-family:var(--num)}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.vbtn{padding:14px 10px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-weight:700;font-size:15px;letter-spacing:.04em;transition:.15s}
.vbtn.y.on{background:linear-gradient(180deg,#2fd58a,#1ba86a);border-color:transparent;color:#05140c;box-shadow:0 10px 30px -10px rgba(47,213,138,.7)}
.vbtn.n.on{background:linear-gradient(180deg,#ff6b80,#d9435a);border-color:transparent;color:#1b0509;box-shadow:0 10px 30px -10px rgba(255,92,114,.6)}
.vbtn:active{transform:scale(.97)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06);margin:14px 0 8px}
.bar i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu)}
.legend b{font-family:var(--num);font-size:15px;color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12.5px}
.chip .nb{min-width:22px;height:22px;padding:0 4px;border-radius:999px;display:grid;place-items:center;font-family:var(--num);font-size:11px;background:var(--red);color:#fff}
.chip.chg{border-color:rgba(255,181,71,.6)} .chip.chg:after{content:"↺";color:var(--warn);font-weight:700}
.chip.me{border-color:var(--gold);background:rgba(217,164,65,.12)}
.grp{margin-top:12px}.grp .lb{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-family:var(--num);display:flex;align-items:center;gap:6px}
.lb.y{color:var(--ok)} .lb.n{color:var(--no)} .lb.q{color:var(--mu)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line2);font-weight:600;font-size:13.5px}
.btn.pri{background:linear-gradient(180deg,var(--red2),var(--red));border-color:transparent;box-shadow:0 10px 24px -12px rgba(195,48,78,.9)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#231703;border-color:transparent}
.btn.ghost{background:transparent}
.btn.full{width:100%} .btn.sm{padding:7px 10px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.adm-bar{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(217,164,65,.35)}
.adm-bar .t{font-size:10.5px;letter-spacing:.2em;color:var(--gold);font-family:var(--num);margin-bottom:8px}
/* lists */
.list .it{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:14px;background:linear-gradient(160deg,var(--red2),var(--red));flex:none}
.av.gd{background:linear-gradient(160deg,var(--gold2),var(--gold));color:#231703}
.av.sv{background:linear-gradient(160deg,#d7dbe3,#8f96a3);color:#1a1c22}
.av.bz{background:linear-gradient(160deg,#e3a06b,#9b5a2d);color:#1f0f05}
.av.gy{background:rgba(255,255,255,.08);color:var(--mu)}
.amt{font-family:var(--num);font-weight:600;font-size:15px;white-space:nowrap}
.amt.neg{color:var(--no)} .amt.pos{color:var(--ok)}
/* match list */
.mi{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.mi .dt{text-align:center;border-right:1px solid var(--line);padding-right:10px}
.mi .dt b{display:block;font-family:var(--num);font-size:20px;line-height:1}
.mi .dt span{font-size:10px;color:var(--mu);letter-spacing:.1em}
.mi .sc{font-family:var(--num);font-size:22px;font-weight:700;text-align:right;white-space:nowrap}
.res{font-family:var(--num);font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;letter-spacing:.1em}
.res.W{background:rgba(47,213,138,.15);color:var(--ok)} .res.D{background:rgba(255,255,255,.08);color:var(--mu)} .res.L{background:rgba(255,92,114,.14);color:var(--no)}
.res.X{background:rgba(255,255,255,.06);color:var(--mu2)} .res.O{background:rgba(217,164,65,.15);color:var(--gold2)}
.goals{font-size:12px;color:var(--mu);margin-top:3px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.seg button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--mu);white-space:nowrap;font-weight:600}
.seg button.on{background:var(--tx);color:#111;border-color:transparent}
/* money */
.total{text-align:center;padding:22px 16px 18px}
.total .lbl{font-size:11px;letter-spacing:.25em;color:var(--mu);font-family:var(--num)}
.total .big{font-family:var(--num);font-size:40px;font-weight:700;margin:6px 0 4px;background:linear-gradient(180deg,#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.split div{padding:10px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);text-align:left}
.split b{display:block;font-family:var(--num);font-size:16px}
.ring{position:absolute;inset:auto -60px -90px auto;width:220px;height:220px;border-radius:50%;border:1px solid rgba(217,164,65,.18);box-shadow:0 0 0 22px rgba(217,164,65,.04),0 0 0 44px rgba(217,164,65,.025)}
.dues{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:10px}
.dues button{padding:8px;border-radius:10px;font-size:12px;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.dues button i{display:block;font-style:normal;font-size:10px;letter-spacing:.12em;margin-top:2px;font-family:var(--num)}
.dues .paid{border-color:rgba(47,213,138,.45);background:rgba(47,213,138,.08)} .dues .paid i{color:var(--ok)}
.dues .unpaid i{color:var(--no)} .dues .void{opacity:.55} .dues .void i{color:var(--mu)}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{padding:12px 6px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);text-align:center}
.tile b{display:block;font-family:var(--num);font-size:22px;line-height:1.1}
.tile span{font-size:10px;letter-spacing:.14em;color:var(--mu);text-transform:uppercase}
.lb-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0}
.lb-row .rk{font-family:var(--num);color:var(--mu2);font-weight:700;text-align:center}
.lb-row .rk.t1{color:var(--gold2)} .lb-row .rk.t2{color:#d7dbe3} .lb-row .rk.t3{color:#e3a06b}
.lb-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.06);margin-top:5px;overflow:hidden}
.lb-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--red),var(--red2))}
.lb-row.top .lb-bar i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
/* profile */
.jersey{display:grid;place-items:center;position:relative;width:120px;margin:0 auto}
.jersey svg{width:120px;height:auto}
.jersey .jn{position:absolute;top:44px;left:0;right:0;text-align:center;font-family:var(--num);font-size:34px;font-weight:700;color:var(--red)}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--safe-b));width:min(532px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:22px;background:rgba(18,19,26,.82);border:1px solid var(--line2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:20;box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:16px;color:var(--mu2);font-size:10.5px;font-weight:600}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--tx);background:rgba(255,255,255,.07)}
.nav button{position:relative}.nav .bdg{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--no);color:#fff;font-size:10px;display:grid;place-items:center;font-family:var(--num)}
.tagp{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:6px;background:rgba(255,181,71,.14);color:var(--warn);font-weight:600}
.nav button.on svg{stroke:var(--gold2);filter:drop-shadow(0 0 6px rgba(242,198,107,.5))}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.mdl{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:#12141c;border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:8px 16px calc(20px + var(--safe-b));animation:up .2s ease-out}
.mdl .grab{width:40px;height:4px;border-radius:9px;background:var(--line2);margin:4px auto 10px}
.mdl h3{margin:4px 0 12px;font-family:var(--num);font-size:18px;letter-spacing:.04em}
@keyframes up{from{transform:translateY(30px);opacity:.5}} @keyframes fd{from{opacity:0}}
.f{margin:10px 0}.f label{display:block;font-size:12px;color:var(--mu);margin-bottom:5px;font-weight:600}
.in{width:100%;padding:12px 13px;border-radius:12px;background:#0a0b10;border:1px solid var(--line2);outline:none;font-size:16px}
.in:focus{border-color:var(--gold)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--line2);font-size:18px;font-weight:700}
.stp b{min-width:30px;text-align:center;font-family:var(--num);font-size:20px}
.stp.big b{font-size:34px;min-width:46px}
.ck{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.ck input{width:20px;height:20px;accent-color:var(--red2)}
.seg2{display:grid;grid-auto-flow:column;gap:6px}
.seg2 label{padding:10px;border-radius:12px;border:1px solid var(--line2);text-align:center;font-size:13px;font-weight:600}
.seg2 input{display:none}.seg2 input:checked+span{color:var(--gold2)}
.seg2 label:has(input:checked){border-color:var(--gold);background:rgba(217,164,65,.1)}
.qr{display:block;width:240px;max-width:100%;margin:6px auto;border-radius:16px;background:#fff;padding:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv>span:first-child{color:var(--mu);flex:none;white-space:nowrap}
/* toast, misc */
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:12px;background:#1d2030;border:1px solid var(--line2);font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90%;animation:fd .2s}
.toast.err{border-color:rgba(255,92,114,.6);color:#ffc0c9}
.load{position:fixed;top:0;left:0;right:0;height:2px;z-index:70;background:linear-gradient(90deg,transparent,var(--gold2),transparent);background-size:50% 100%;animation:ld 1s linear infinite}
@keyframes ld{from{background-position:-50% 0}to{background-position:150% 0}}
.demo{font-size:12px;padding:8px 12px;border-radius:12px;background:rgba(217,164,65,.1);border:1px solid rgba(217,164,65,.35);color:var(--gold2);margin-bottom:6px}
.empty{text-align:center;color:var(--mu);padding:26px 10px;font-size:13.5px}
.alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,92,114,.08);border:1px solid rgba(255,92,114,.35);margin:12px 0}
.alert b{font-family:var(--num)}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:ld 1.2s linear infinite;margin:12px 0}
hr.d{border:0;border-top:1px solid var(--line);margin:12px 0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ===================== CẤU HÌNH & TRẠNG THÁI ===================== */
const API = String(window.FCGN_API || '').trim();
const DEMO = !/^https:\/\/script\.google\.com\//.test(API);
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const S = { data: null, tab: (location.hash || '#home').slice(1), me: LS.get('fcgn_me', null), admin: LS.get('fcgn_admin', ''),
  year: 'all', busy: 0, err: '' };
if (!['home', 'matches', 'money', 'stats', 'me'].includes(S.tab)) S.tab = 'home';

/* ===================== GỌI SERVER ===================== */
let DEMO_DB = null;
function demoEnv() { let n = 0; return { uid: () => 'd' + Date.now().toString(36) + (n++), hash: s => 'x' + s, guard() {}, fail() {}, ok() {} }; }
function buildDemo() {
  const env = demoEnv(), T = s => Date.parse(s + '+07:00');
  const db = { config: { adminCode: '1234', fineStart: '2026-11-01', defaultPlace: 'Sân bóng quen' } };
  Object.keys(FC.TABLES).forEach(t => db[t] = []);
  FC.seed(db, FC_SEED);
  const names = [['Phạm Đức', 10], ['Việt Quang', 9], ['Đình Huy', 4], ['Đức Thịnh', 8], ['Trường Giang', 11], ['Quốc Việt', 7], ['Tuấn Đức', 17],
    ['Quang Hùng', 5], ['Huỳnh Tân', 96], ['Hải Phương', 30], ['Đức Anh', 123], ['Hoàng Giang', 23], ['Văn Mạnh', 14]];
  const ids = {};
  names.forEach(([n, no]) => { const r = FC.handle(db, 'register', { name: n, number: no, pin: '1111' }, T('2026-10-01T09:00:00'), env); ids[n] = r.res.player.id;
    db.goals.forEach(g => { if (g.scorer === 'n:' + n) g.scorer = ids[n]; }); });
  db.players.forEach(p => p.createdAt = '2026-10-01T00:00:00.000Z');
  db.players.find(p => p.name === 'Văn Mạnh').rest = '9999-12-31';
  let now = T('2026-11-10T09:00:00'); FC.ensure(db, now, env);
  const m1 = db.matches.find(m => m.date === '2026-11-15'); m1.opponent = 'FC Valencia';
  const V = (n, mid, v, t) => FC.handle(db, 'vote', { playerId: ids[n], pin: '1111', matchId: mid, vote: v }, T(t), env);
  names.slice(0, 10).forEach(([n], i) => V(n, m1.id, i < 8 ? 'di' : 'khong', '2026-11-12T10:00:00'));
  now = T('2026-11-15T21:30:00'); FC.ensure(db, now, env);
  FC.handle(db, 'finalize', { admin: '1234', id: m1.id, gf: 4, ga: 2, scorers: [{ key: ids['Phạm Đức'], count: 2 }, { key: ids['Việt Quang'], count: 1 }, { key: ids['Trường Giang'], count: 1 }],
    absent: [ids['Quang Hùng']], extra: [ids['Hải Phương']], fieldCost: 600000, fieldPayer: 'duc' }, now, env);
  const paid = db.charges.filter(c => (c.type === 'fee' && c.status === 'unpaid' && c.playerId !== ids['Tuấn Đức'] && c.playerId !== ids['Quốc Việt']) || (c.type === 'dues' && Math.random() < .5)).map(c => c.id);
  FC.handle(db, 'setPaid', { admin: '1234', ids: paid, paid: true }, now, env);
  const td = db.charges.find(c => c.playerId === ids['Tuấn Đức'] && c.type === 'fee');
  if (td) FC.handle(db, 'claim', { playerId: ids['Tuấn Đức'], pin: '1111', collector: 'duc', chargeIds: [td.id], topup: 0, note: 'ck tối CN' }, now, env);
  FC.handle(db, 'addTxn', { admin: '1234', kind: 'out', cat: 'party', amount: 850000, holder: 'tan', date: '2026-11-08', note: 'Liên hoan' }, now, env);
  now = Date.now(); FC.ensure(db, now, env);
  const nx = db.matches.filter(m => m.status === 'open' && m.source === 'app').sort((a, b) => a.date < b.date ? -1 : 1)[0];
  if (nx) { nx.opponent = 'FC Sensitive'; nx.place = 'Sân bóng quen';
    names.slice(0, 7).forEach(([n], i) => { try { V(n, nx.id, i === 5 ? 'khong' : 'di', FC.today(now) + 'T08:00:00'); } catch (e) {} }); }
  return db;
}
async function api(action, params = {}) {
  if (DEMO) {
    await new Promise(r => setTimeout(r, 250));
    if (!DEMO_DB) DEMO_DB = buildDemo();
    const env = demoEnv(), now = Date.now();
    FC.ensure(DEMO_DB, now, env);
    let res = {};
    if (action !== 'data') res = FC.handle(DEMO_DB, action, params, now, env).res;
    return { result: res, data: JSON.parse(JSON.stringify(FC.view(DEMO_DB, FC.isAdminCode(DEMO_DB, params.admin)))) };
  }
  const get = action === 'data' && !params.admin;
  const opt = get ? undefined : { method: 'POST', body: JSON.stringify(Object.assign({ action }, params)) };
  const r = await fetch(get ? API + '?t=' + Date.now() : API, opt);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Lỗi server');
  return j;
}
async function act(action, params = {}, okMsg) {
  S.busy++; paintLoad();
  try {
    if (S.admin && !params.admin) params.admin = S.admin;
    const j = await api(action, params);
    S.data = j.data; LS.set('fcgn_cache', j.data);
    if (okMsg) toast(okMsg);
    render();
    return j.result || {};
  } catch (e) { toast(e.message || 'Có lỗi, thử lại nhé', true); throw e; }
  finally { S.busy--; paintLoad(); }
}
async function refresh(silent) {
  S.busy++; paintLoad();
  try { const j = await api('data', S.admin ? { admin: S.admin } : {}); S.data = j.data; S.err = ''; LS.set('fcgn_cache', j.data); }
  catch (e) { S.err = 'Không tải được dữ liệu mới. Kiểm tra mạng rồi kéo lại nhé.'; if (!silent) toast(S.err, true); }
  finally { S.busy--; paintLoad(); render(); }
}

/* ===================== TIỆN ÍCH ===================== */
const D = () => S.data;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Math.round(+n || 0).toLocaleString('vi-VN') + 'đ';
const kmoney = n => { n = Math.round(+n || 0); return Math.abs(n) >= 1000 && n % 1000 === 0 ? (n / 1000).toLocaleString('vi-VN') + 'k' : money(n); };
const DOW = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const dd = s => { const p = s.split('-'); return p[2] + '/' + p[1]; };
const ddy = s => { const p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
const dow = s => DOW[FC.weekday(s)];
const byName = (a, b) => a.name.localeCompare(b.name, 'vi');
const unaccent = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
const today = () => FC.today(Date.now());
const P = id => D().players.find(p => p.id === id);
const pname = id => { const p = P(id); return p ? p.name : '?'; };
const sname = k => k.startsWith('n:') ? k.slice(2) : pname(k);
const active = () => D().players.filter(p => p.active !== 'no').sort(byName);
const initials = n => { const w = n.trim().split(/\s+/); return (w.length > 1 ? w[w.length - 2][0] + w[w.length - 1][0] : w[0].slice(0, 2)).toUpperCase(); };
const curVote = (mid, pid) => { const v = FC.lastVote(D(), mid, pid, null); return v ? v.vote : ''; };
const snapOf = mid => { const o = {}; D().snaps.forEach(s => { if (s.matchId === mid) o[s.playerId] = s.vote; }); return o; };
const goalsOf = mid => D().goals.filter(g => g.matchId === mid).sort((a, b) => b.count - a.count);
const resOf = m => m.status === 'cancelled' ? 'X' : m.status !== 'done' ? 'O' : (+m.gf > +m.ga ? 'W' : +m.gf < +m.ga ? 'L' : 'D');
const RES_TXT = { W: 'THẮNG', D: 'HÒA', L: 'THUA', X: 'HỦY', O: 'SẮP ĐÁ' };
const TYPE = { fee: 'Tiền trận', absent: 'Phạt vắng', novote: 'Phạt không vote', dues: 'Quỹ quý' };
const COL = { tan: 'Tân', duc: 'Đức' };
const CAT = { opening: 'Số dư đầu kỳ', field: 'Tiền sân', party: 'Liên hoan', other: 'Khác', transfer: 'Chuyển quỹ' };
const isAdmin = () => !!S.admin;
const me = () => S.me && P(S.me.id) ? S.me : null;

function nextMatch() {
  const t = today();
  const up = D().matches.filter(m => m.source === 'app' && m.date >= t && m.status !== 'done').sort((a, b) => a.date < b.date ? -1 : 1);
  return up[0] || null;
}
const wUsed = c => (D().wallet || []).reduce((s, w) => s + (w.kind === 'use' && w.chargeId === c.id ? +w.amount : 0), 0);
const claims = () => D().claims || [];
const pendingClaims = () => claims().filter(c => c.status === 'pending').sort((a, b) => a.createdAt < b.createdAt ? -1 : 1);
function pendingSet() { const o = {}; pendingClaims().forEach(c => FC.parseItems(c.items).forEach(it => o[it.id] = 1)); return o; }
function walletBal(pid) { return (D().wallet || []).reduce((s, w) => s + (w.playerId === pid ? (w.kind === 'use' ? -w.amount : +w.amount) : 0), 0); }
function walletHeld() { return D().sum ? D().sum.held : 0; }
function balances() {
  if (D().sum) return { tan: D().sum.tan, duc: D().sum.duc };
  const b = { tan: 0, duc: 0 };
  D().charges.forEach(c => { if (c.status === 'paid') b[c.collector] += +c.amount; else if (c.status === 'unpaid') b[c.collector] += wUsed(c); });
  D().txns.forEach(t => { const a = +t.amount; if (t.kind === 'in') b[t.holder] += a; else if (t.kind === 'out') b[t.holder] -= a; else { b[t.holder] -= a; b[t.to] += a; } });
  return b;
}
function debts() {
  const o = {};
  D().charges.forEach(c => { if (c.status !== 'unpaid') return; const r = +c.amount - wUsed(c); if (r <= 0) return; const d = o[c.playerId] || (o[c.playerId] = { total: 0, tan: 0, duc: 0, items: [] });
    d.total += r; d[c.collector] += r; d.items.push(c); });
  return o;
}
function toast(msg, err) {
  const el = document.getElementById('toast'); el.innerHTML = `<div class="toast ${err ? 'err' : ''}">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => el.innerHTML = '', err ? 4200 : 2200);
}
function paintLoad() { let el = document.getElementById('ld'); if (S.busy && !el) { el = document.createElement('div'); el.id = 'ld'; el.className = 'load'; document.body.appendChild(el); } if (!S.busy && el) el.remove(); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('Đã copy – dán vào Messenger nhé'); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove();
  if (ok) toast('Đã copy – dán vào Messenger nhé');
  else modal(`<h3>Copy tin nhắn</h3><p class="mu sm">Giữ ngón tay vào ô dưới → Chọn tất cả → Sao chép</p><textarea class="in" rows="12" readonly>${esc(text)}</textarea>`);
}
const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  matches: '<circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/><path d="M12 3v4M21 10l-5 0M3 10h5M7 20l2.5-5.5M17 20l-2.5-5.5"/>',
  money: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/><path d="M6 6l9-3 2 3"/>',
  stats: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  me: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'
};

/* ===================== GIAO DIỆN ===================== */
function render() {
  const app = document.getElementById('app');
  document.getElementById('nav').innerHTML = [['home', 'Trang chủ'], ['matches', 'Trận đấu'], ['money', 'Quỹ'], ['stats', 'Thống kê'], ['me', me() ? 'Tôi' : 'Đăng nhập']]
    .map(([k, l]) => `<button class="${S.tab === k ? 'on' : ''}" data-a="tab" data-v="${k}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${l}${k === 'money' && isAdmin() && D() && pendingClaims().length ? `<span class="bdg">${pendingClaims().length}</span>` : ''}</button>`).join('');
  const head = `<header class="top"><img src="logo.png" alt=""><div class="brand">FC GÌ NHỈ<small>EST · 2020</small></div><div class="sp"></div>
    <button class="pill" data-a="guide" style="padding:6px 10px" aria-label="Hướng dẫn">?</button>
    ${isAdmin() ? '<span class="pill adm">★</span>' : ''}
    ${me() ? `<span class="pill"><span class="dot"></span><b>${esc(me().name)}</b></span>` : `<button class="pill" data-a="tab" data-v="me">Đăng nhập</button>`}</header>`;
  if (!D()) { app.innerHTML = head + '<div class="skel" style="height:200px"></div><div class="skel"></div><div class="skel"></div>'; return; }
  const demo = DEMO ? `<div class="demo">Bản xem thử · dữ liệu giả · PIN của mọi người: <b>1111</b> · mã admin: <b>1234</b></div>` : '';
  const err = S.err ? `<div class="alert"><span>⚠️</span><span class="sm">${esc(S.err)}</span></div>` : '';
  const page = { home: pHome, matches: pMatches, money: pMoney, stats: pStats, me: pMe }[S.tab]();
  app.innerHTML = head + demo + err + page;
  tick();
}

/* ---------- TRANG CHỦ ---------- */
function voteGroups(m) {
  const snapped = m.snap === 'yes', snap = snapped ? snapOf(m.id) : {};
  const g = { di: [], khong: [], none: [], rest: [] };
  active().forEach(p => { const v = curVote(m.id, p.id); const chg = snapped && (snap[p.id] || '') !== v;
    (g[v === 'di' ? 'di' : v === 'khong' ? 'khong' : FC.resting(p, m.date) ? 'rest' : 'none']).push({ p, chg }); });
  return g;
}
function chipsHTML(arr) {
  if (!arr.length) return '<div class="mu2 sm" style="margin-top:6px">—</div>';
  return '<div class="chips">' + arr.map(({ p, chg }) => `<span class="chip ${chg ? 'chg' : ''} ${me() && me().id === p.id ? 'me' : ''}"><span class="nb">${esc(p.number || '·')}</span>${esc(p.name)}</span>`).join('') + '</div>';
}
function pHome() {
  const m = nextMatch();
  let h = `<section class="hero" id="hero">${PHOTOS.map((p, i) => `<img src="${p}" alt="" class="${i === S.photo ? 'on' : ''}">`).join('')}
    <div class="dots">${PHOTOS.map((p, i) => `<i class="${i === S.photo ? 'on' : ''}"></i>`).join('')}</div><div class="ht"><div class="k">SUNDAY · 18:00 · WEEKLY</div><h1>FC GÌ NHỈ</h1></div></section>`;
  const my = me(); const dbt = my ? (debts()[my.id] || null) : null;
  if (dbt && dbt.total > 0) h += `<div class="alert"><span style="font-size:20px">💸</span><div class="grow sm">Ông đang nợ <b>${money(dbt.total)}</b></div><button class="btn sm" data-a="tab" data-v="money">Xem & trả</button></div>`;
  if (isAdmin() && pendingClaims().length) h += `<div class="alert" style="background:rgba(255,181,71,.08);border-color:rgba(255,181,71,.4)"><span style="font-size:20px">⏳</span><div class="grow sm"><b>${pendingClaims().length}</b> yêu cầu chuyển khoản chờ xác nhận</div><button class="btn sm" data-a="tab" data-v="money">Kiểm tra</button></div>`;
  if (!my) h += `<div class="alert" style="background:rgba(217,164,65,.08);border-color:rgba(217,164,65,.35)"><span style="font-size:20px">👋</span><div class="grow sm">Lần đầu dùng? Đăng ký tên + PIN là vote được.</div><button class="btn sm" data-a="guide">Hướng dẫn</button></div>`;
  if (!m) h += `<div class="card"><div class="empty">Chưa có trận nào sắp tới.</div></div>`;
  else {
    const dl = FC.deadline(m.date), passed = Date.now() >= dl, cancelled = m.status === 'cancelled';
    const g = voteGroups(m), n = active().length || 1;
    const myV = my ? curVote(m.id, my.id) : '';
    h += `<div class="card glow"><div class="row sb"><span class="tag ${cancelled ? 'gr' : ''}">${cancelled ? 'ĐÃ HỦY' : 'TRẬN TỚI'}</span><span class="num mu">${dow(m.date)} ${dd(m.date)} · ${esc(m.time || '18:00')}</span></div>
      <div class="vs"><div class="team"><div class="crest"><img src="logo.png" alt=""></div><b>FC GN</b></div><div class="vsm">VS</div>
      <div class="team"><div class="crest opp">${m.opponent ? esc(initials(m.opponent.replace(/^FC\s+/i, ''))) : '?'}</div><b>${esc(m.opponent || 'Chưa có đối')}</b></div></div>
      ${m.place ? `<div class="meta"><span>📍 ${esc(m.place)}</span></div>` : ''}`;
    if (!cancelled) {
      if (!passed) h += `<div class="cdl">Hạn vote · 20:00 T7 ${dd(FC.addDays(m.date, -1))}</div><div class="cd" id="cd" data-t="${dl}"></div>`;
      else h += `<div class="cdl" style="color:var(--gold2)">● Đã chốt vote lúc 20:00 T7 · ↺ = đổi sau hạn</div>`;
      h += `<div class="vote"><button class="vbtn y ${myV === 'di' ? 'on' : ''}" data-a="vote" data-v="di" data-m="${m.id}">✓ ĐI ĐÁ</button>
        <button class="vbtn n ${myV === 'khong' ? 'on' : ''}" data-a="vote" data-v="khong" data-m="${m.id}">✕ KHÔNG ĐI</button></div>
        ${!my ? '<div class="mu xs" style="text-align:center;margin-top:8px">Đăng nhập để vote</div>' : ''}
        <div class="bar"><i style="width:${g.di.length / n * 100}%;background:var(--ok)"></i><i style="width:${g.khong.length / n * 100}%;background:var(--no)"></i></div>
        <div class="legend"><span><b>${g.di.length}</b> đi</span><span><b>${g.khong.length}</b> không</span><span><b>${g.none.length}</b> chưa vote</span></div>
        <div class="grp"><div class="lb y">● Đi đá (${g.di.length})</div>${chipsHTML(g.di)}</div>
        <div class="grp"><div class="lb n">● Không đi (${g.khong.length})</div>${chipsHTML(g.khong)}</div>
        ${g.rest.length ? `<div class="grp"><div class="lb q" style="color:#8fb4ff">● Tạm nghỉ / chấn thương (${g.rest.length})</div>${chipsHTML(g.rest)}</div>` : ''}
        <div class="grp"><div class="lb q">● Chưa vote (${g.none.length})${!passed && D().config.fineStart <= m.date ? ' · quá hạn phạt ' + kmoney(D().config.noVoteFine) : ''}</div>${chipsHTML(g.none)}</div>`;
    }
    if (isAdmin()) h += `<div class="adm-bar"><div class="t">★ ADMIN</div><div class="btns" style="margin:0">
      <button class="btn sm" data-a="editMatch" data-m="${m.id}">✎ Sửa trận</button>
      ${!cancelled ? `<button class="btn sm" data-a="copyVote" data-m="${m.id}">⧉ Copy nhắc vote</button>` : ''}
      ${!cancelled && passed ? `<button class="btn sm gold" data-a="finalize" data-m="${m.id}">🏁 Chốt kết quả</button>` : ''}
      <button class="btn sm ghost" data-a="cancel" data-m="${m.id}" data-v="${cancelled ? 0 : 1}">${cancelled ? '↺ Khôi phục' : '⦸ Hủy trận'}</button></div></div>`;
    h += `</div>`;
  }
  const last = D().matches.filter(x => x.status === 'done').sort((a, b) => a.date < b.date ? 1 : -1)[0];
  if (last) {
    const r = resOf(last), gs = goalsOf(last.id);
    h += `<div class="h"><h2>Trận gần nhất</h2><button class="mu sm" data-a="tab" data-v="matches">Tất cả →</button></div>
      <div class="card" data-a="match" data-m="${last.id}"><div class="row sb"><span class="mu sm">${dow(last.date)} ${ddy(last.date)}</span><span class="res ${r}">${RES_TXT[r]}</span></div>
      <div class="vs" style="margin:10px 0 4px"><div class="team"><b>FC GN</b></div><div class="score">${last.gf}<span class="mu2"> : </span>${last.ga}</div><div class="team"><b>${esc(last.opponent || '?')}</b></div></div>
      ${gs.length ? `<div class="goals" style="text-align:center">⚽ ${gs.map(g => esc(sname(g.scorer)) + (g.count > 1 ? ' ×' + g.count : '')).join(' · ')}</div>` : ''}</div>`;
  }
  return h;
}
function tick() {
  const el = document.getElementById('cd'); if (!el) return;
  let s = Math.max(0, Math.floor((+el.dataset.t - Date.now()) / 1000));
  if (s === 0 && !tick.reloaded) { tick.reloaded = 1; refresh(true); }
  const d = Math.floor(s / 86400); s %= 86400; const hh = Math.floor(s / 3600); s %= 3600; const mm = Math.floor(s / 60); s %= 60;
  const p = n => String(n).padStart(2, '0');
  el.innerHTML = [[d, 'ngày'], [p(hh), 'giờ'], [p(mm), 'phút'], [p(s), 'giây']].map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('');
}
setInterval(tick, 1000);
const PHOTOS = ['team.jpg', 'team2.jpg', 'team3.jpg', 'team4.jpg'];
S.photo = 0;
setInterval(() => {
  const hero = document.getElementById('hero'); if (!hero || document.hidden) return;
  S.photo = (S.photo + 1) % PHOTOS.length;

function pStats() {
  const ms = D().matches.filter(m => m.status === 'done' && (S.year === 'all' || m.date.startsWith(S.year)));
  const W = ms.filter(m => +m.gf > +m.ga).length, L = ms.filter(m => +m.gf < +m.ga).length, Dr = ms.length - W - L;
  const gf = ms.reduce((s, m) => s + +m.gf, 0), ga = ms.reduce((s, m) => s + +m.ga, 0);
  const ids = new Set(ms.map(m => m.id));
  const sc = {};
  D().goals.forEach(g => { if (!ids.has(g.matchId) || g.hidden === 'yes') return; if (g.scorer.startsWith('n:') || P(g.scorer)) sc[g.scorer] = (sc[g.scorer] || 0) + +g.count; });
  const top = Object.entries(sc).sort((a, b) => b[1] - a[1]).slice(0, 15), mx = top.length ? top[0][1] : 1;
  const att = {}, abs = {};
  D().charges.forEach(c => { if (!ids.has(c.matchId) || c.status === 'void') return; if (c.type === 'fee') att[c.playerId] = (att[c.playerId] || 0) + 1; if (c.type === 'absent') abs[c.playerId] = (abs[c.playerId] || 0) + 1; });
  const appN = ms.filter(m => m.source === 'app').length;
  const at = active().map(p => [p, att[p.id] || 0, abs[p.id] || 0]).sort((a, b) => b[1] - a[1] || a[2] - b[2]);
  const rk = i => i < 3 ? 't' + (i + 1) : '';
  let h = `<div class="h" style="margin-top:6px"><h2>Thống kê</h2></div>` + segYears();
  h += `<div class="card"><div class="tiles"><div class="tile"><b>${ms.length}</b><span>Trận</span></div><div class="tile"><b style="color:var(--ok)">${W}</b><span>Thắng</span></div>
    <div class="tile"><b>${Dr}</b><span>Hòa</span></div><div class="tile"><b style="color:var(--no)">${L}</b><span>Thua</span></div></div>
    <div class="split" style="grid-template-columns:1fr 1fr 1fr"><div><span class="mu xs">Bàn thắng</span><b>${gf}</b></div><div><span class="mu xs">Bàn thua</span><b>${ga}</b></div><div><span class="mu xs">Tỉ lệ thắng</span><b>${ms.length ? Math.round(W / ms.length * 100) : 0}%</b></div></div></div>`;
  h += `<div class="h"><h2>Vua phá lưới</h2><span class="mu xs">⚽</span></div><div class="card" style="padding:8px 14px">${top.map(([k, v], i) => `<div class="lb-row ${i < 3 ? 'top' : ''}"><div class="rk ${rk(i)}">${i + 1}</div>
    <div style="min-width:0"><div class="ell"><b>${esc(sname(k))}</b>${k.startsWith('n:') ? ' <span class="mu2 xs">(chưa đăng ký)</span>' : ''}</div><div class="lb-bar"><i style="width:${v / mx * 100}%"></i></div></div><b class="num" style="font-size:18px">${v}</b></div>`).join('') || '<div class="empty">Chưa có dữ liệu</div>'}</div>`;
  h += `<div class="h"><h2>Chuyên cần</h2><span class="mu xs">${appN} trận trên app</span></div><div class="card" style="padding:8px 14px">${appN ? at.map(([p, a, b], i) => `<div class="lb-row ${i < 3 && a ? 'top' : ''}"><div class="rk ${a ? rk(i) : ''}">${i + 1}</div>
    <div style="min-width:0"><div class="ell"><b>${esc(p.name)}</b>${b ? ` <span class="xs" style="color:var(--no)">· vắng ${b}</span>` : ''}</div><div class="lb-bar"><i style="width:${a / appN * 100}%"></i></div></div><b class="num" style="font-size:16px">${a}<span class="mu2 xs">/${appN}</span></b></div>`).join('')
    : '<div class="empty">Tính từ khi bắt đầu dùng app<br><span class="xs">(lịch sử Facebook không ghi ai đi)</span></div>'}</div>`;
  return h;
}

function claimModal(who) {

    ${who === 'duc' ? `<label class="ck" style="border-bottom:0"><input type="checkbox" id="cl-pre"><div class="grow"><b>Đóng trước các trận tới</b><div class="mu xs">Nạp vào ví, mỗi trận tự trừ ${kmoney(fee)}</div></div></label>

const preN = () => { const b = document.querySelector('#cl-n b'); return b ? Math.max(1, +b.textContent || 1) : 0; };

  const box = document.getElementById('cl-prebox'); if (box) { box.style.opacity = document.getElementById('cl-pre').checked ? 1 : .4; document.getElementById('cl-preamt').textContent = kmoney(preN() * +D().config.feeAmount); }
}

    <div class="list">${rows.map(w => { const c = w.kind === 'use' ? ch(w.chargeId) : null;
      return `<div class="it"><div class="av ${w.kind === 'use' ? 'gy' : 'gd'}" style="font-size:16px">${w.kind === 'use' ? '−' : '＋'}</div><div class="grow"><b>${w.kind === 'use' ? (c ? TYPE[c.type] : 'Trừ') : 'Nạp ví'}</b><div class="mu xs">${ddy(w.date)}${w.note ? ' · ' + esc(w.note) : ''}</div></div>
      <span class="amt ${w.kind === 'use' ? 'neg' : 'pos'}">${w.kind === 'use' ? '−' : '+'}${kmoney(w.amount)}</span>${isAdmin() && w.kind === 'topup' ? `<button class="mu2" data-a="delTopup" data-v="${w.id}" style="padding:4px">✕</button>` : ''}</div>`; }).join('') || '<div class="empty">Chưa có giao dịch</div>'}</div>
    ${isAdmin() ? `<div class="btns"><button class="btn gold full" data-a="topup" data-v="${pid}">＋ Nạp thêm</button></div>` : ''}`);
}
function topupModal(pid) {
  modal(`<h3>Nạp ví trả trước</h3><div class="mu sm">Tiền người đó chuyển trước cho Đức. Không tính vào quỹ, mỗi trận tự trừ tiền trận & tiền phạt.</div>
    <div class="f"><label>Thành viên</label><select class="in" id="tp-p"><option value="">— Chọn —</option>${active().map(p => `<option value="${p.id}" ${p.id === pid ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
    <div class="f"><label>Số tiền (đồng)</label><input class="in num" id="tp-a" inputmode="numeric" placeholder="VD: 300000"></div>
    <div class="two"><div class="f"><label>Ngày</label><input class="in" id="tp-d" type="date" value="${today()}"></div><div class="f"><label>Ghi chú</label><input class="in" id="tp-n" placeholder="tuỳ chọn"></div></div>
    <div class="btns"><button class="btn pri full" data-a="doTopup">Nạp</button></div>`);
}
function settingsModal() {
  const c = D().config, F = (k, l, ph, t) => `<div class="f"><label>${l}</label><input class="in" id="cf-${k}" value="${esc(c[k])}" placeholder="${ph || ''}" ${t ? 'type="' + t + '"' : ''}></div>`;
  modal(`<h3>Cài đặt</h3>
    <div class="h" style="margin-top:4px"><h2>Thủ quỹ – quỹ quý</h2></div>${F('tanName', 'Tên hiển thị')}<div class="two">${F('tanBank', 'Mã ngân hàng', 'VD: VCB, MB, TCB')}${F('tanAcc', 'Số tài khoản')}</div>${F('tanHolder', 'Chủ tài khoản (không dấu)', 'VD: HUYNH VAN TAN')}
    <div class="h"><h2>Thu tiền trận</h2></div>${F('ducName', 'Tên hiển thị')}<div class="two">${F('ducBank', 'Mã ngân hàng', 'VD: VCB, MB, TCB')}${F('ducAcc', 'Số tài khoản')}</div>${F('ducHolder', 'Chủ tài khoản (không dấu)')}
    <div class="h"><h2>Trận đấu</h2></div><div class="two">${F('defaultTime', 'Giờ đá mặc định', '', 'time')}${F('fineStart', 'Bắt đầu tính phạt từ', '', 'date')}</div>${F('defaultPlace', 'Sân mặc định')}
    <div class="h"><h2>Mức tiền</h2></div><div class="two">${F('duesAmount', 'Quỹ quý')}${F('feeAmount', 'Tiền trận')}${F('noVoteFine', 'Phạt không vote')}${F('absentFine', 'Phạt vắng')}</div>
    <div class="btns"><button class="btn pri full" data-a="doSettings">Lưu cài đặt</button></div>`);
}
function membersModal() {
  modal(`<h3>Thành viên (${active().length})</h3><div class="list">${D().players.slice().sort(byName).map(p => `<div class="it" data-a="member" data-v="${p.id}"><div class="av ${p.active === 'no' ? 'gy' : ''}">${esc(p.number || initials(p.name))}</div><div class="grow"><b>${esc(p.name)}</b>${p.active === 'no' ? ' <span class="mu xs">(đã nghỉ)</span>' : ''}${FC.resting(p, today()) ? ` <span class="tagp" style="background:rgba(143,180,255,.12);color:#8fb4ff">🤕 ${p.rest === '9999-12-31' ? 'tạm nghỉ' : 'nghỉ đến ' + dd(p.rest)}</span>` : ''}</div><span class="mu">✎</span></div>`).join('') || '<div class="empty">Chưa ai đăng ký</div>'}</div>`);
}
function memberForm(id) {
  const p = P(id);
  modal(`<h3>Sửa thành viên</h3><div class="f"><label>Tên</label><input class="in" id="mb-n" value="${esc(p.name)}"></div>
    <div class="two"><div class="f"><label>Số áo</label><input class="in num" id="mb-no" inputmode="numeric" value="${esc(p.number)}"></div><div class="f"><label>PIN mới (bỏ trống nếu giữ)</label><input class="in num" id="mb-p" inputmode="numeric" maxlength="4"></div></div>
    <div class="h" style="margin-top:14px"><h2>Chấn thương / tạm nghỉ</h2></div>
    <label class="ck"><input type="checkbox" id="mb-r" ${FC.resting(p, today()) ? 'checked' : ''}><span>Đang tạm nghỉ – không phạt không vote, không phạt vắng</span></label>
    <div class="f"><label>Nghỉ đến hết ngày (bỏ trống = nghỉ tới khi bỏ tick)</label><input class="in" id="mb-rd" type="date" value="${p.rest && p.rest !== '9999-12-31' ? p.rest : ''}"></div>
    <label class="ck"><input type="checkbox" id="mb-a" ${p.active !== 'no' ? 'checked' : ''}><span>Đang trong đội (bỏ tích = rời đội hẳn, không tính quỹ/phạt nữa)</span></label>
    <div class="btns"><button class="btn pri full" data-a="doMember" data-v="${id}">Lưu</button></div>`);
}
function mergeModal() {
  const names = {}; D().goals.forEach(g => { if (g.scorer.startsWith('n:') && g.hidden !== 'yes') names[g.scorer.slice(2)] = (names[g.scorer.slice(2)] || 0) + +g.count; });
  const wn = {}; (D().wallet || []).forEach(w => { if (w.playerId.startsWith('n:')) { const n = w.playerId.slice(2); wn[n] = 1; if (!(n in names)) names[n] = 0; } });
  const rows = Object.entries(names).sort((a, b) => b[1] - a[1]);
  modal(`<h3>Ghép tên lịch sử</h3><div class="mu sm">Tên trong lịch sử / ví đóng trước → tài khoản đã đăng ký. Ghép xong bàn thắng cũ và tiền ví cộng vào người đó.</div>
    <div class="list" style="margin-top:8px">${rows.map(([n, c]) => `<div class="it"><div class="grow"><b>${esc(n)}</b> <span class="mu xs">${c ? c + ' bàn' : ''}${wn[n] ? (c ? ' · ' : '') + 'có ví đóng trước' : ''}</span>
      <select class="in" style="margin-top:6px;padding:9px" data-merge="${esc(n)}"><option value="">— Chọn tài khoản —</option>${active().map(p => `<option value="${p.id}" ${p.name.toLowerCase() === n.toLowerCase() ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
      <button class="btn sm gold" data-a="doMerge" data-v="${esc(n)}">Ghép</button></div>`).join('') || '<div class="empty">Đã ghép hết rồi 👍</div>'}</div>`);
}

/* ---------- tin nhắn copy ---------- */
function voteText(m) {
  const g = voteGroups(m), nm = a => a.map(x => x.p.name).join(', ') || '—';
  return `⚽ FC GÌ NHỈ – ${dow(m.date)} ${dd(m.date)} · ${m.time || '18:00'}\n🆚 ${m.opponent || 'Chưa có đối'}${m.place ? '\n📍 ' + m.place : ''}\n⏰ Hạn vote: 20h T7 ${dd(FC.addDays(m.date, -1))}\n\n✅ Đi (${g.di.length}): ${nm(g.di)}\n❌ Không (${g.khong.length}): ${nm(g.khong)}${g.rest.length ? `\n🤕 Tạm nghỉ (${g.rest.length}): ${nm(g.rest)}` : ''}\n❓ Chưa vote (${g.none.length}): ${nm(g.none)}${D().config.fineStart <= m.date ? `\n→ Quá hạn chưa vote phạt ${kmoney(D().config.noVoteFine)}` : ''}\n\n👉 Vote tại: ${location.href.split('#')[0]}`;
}
function sumText(m) {
  const gs = goalsOf(m.id), ch = D().charges.filter(c => c.matchId === m.id && c.status !== 'void');
  const L = t => ch.filter(c => c.type === t).map(c => pname(c.playerId));
  const r = resOf(m), b = balances(), db = Object.entries(debts()).filter(([p]) => P(p)).sort((a, c) => c[1].total - a[1].total);
  let t = `🏁 FC GN ${m.gf} - ${m.ga} ${m.opponent || ''} (${RES_TXT[r]})\n📅 ${dow(m.date)} ${ddy(m.date)}`;
  if (gs.length) t += `\n⚽ ${gs.map(g => sname(g.scorer) + (g.count > 1 ? ' x' + g.count : '')).join(', ')}`;
  if (m.source === 'app') {
    t += `\n👟 Đá (${L('fee').length}): ${L('fee').join(', ') || '—'}`;
    if (L('absent').length) t += `\n🚫 Vắng – phạt ${kmoney(D().config.absentFine)}: ${L('absent').join(', ')}`;
    if (L('novote').length) t += `\n⏰ Không vote – phạt ${kmoney(D().config.noVoteFine)}: ${L('novote').join(', ')}`;
  }
  t += `\n\n💰 Tồn quỹ: ${money(b.tan + b.duc)}`;
  if (db.length) t += `\n💸 Còn nợ: ${db.map(([p, d]) => pname(p) + ' ' + kmoney(d.total)).join(', ')}`;
  t += `\n👉 ${location.href.split('#')[0]}`;
  return t;
}

/* ===================== XỬ LÝ BẤM NÚT ===================== */
function needAdmin() { return { admin: S.admin }; }
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, mid = el.dataset.m;
  if (a === 'close') { if (e.target === el) modal(''); return; }
  if (a === 'close2') { modal(''); return; }
  try {
    switch (a) {
      case 'tab': modal(''); S.tab = v; location.hash = v; render(); window.scrollTo(0, 0); break;
      case 'year': S.year = v; render(); break;
      case 'vote':
        if (!me()) { S.tab = 'me'; render(); toast('Đăng nhập trước đã nhé'); return; }
        if (curVote(mid, me().id) === v) return;
        await act('vote', { playerId: me().id, pin: me().pin, matchId: mid, vote: v }, v === 'di' ? 'Đã vote ĐI ✓' : 'Đã vote KHÔNG ĐI');
        break;
      case 'login': loginModal(); break;
      case 'register': registerModal(); break;
      case 'doLogin': {
        const pid = val('lg-p'), pin = val('lg-pin'); if (!pid) return toast('Chọn tên đã', true);
        const r = await act('login', { playerId: pid, pin }); S.me = { id: r.player.id, pin, name: r.player.name }; LS.set('fcgn_me', S.me); modal(''); toast('Chào ' + r.player.name + ' 👋'); render(); break;
      }
      case 'doRegister': {
        const pin = val('rg-p'); if (pin !== val('rg-p2')) return toast('2 lần PIN không giống nhau', true);
        const r = await act('register', { name: val('rg-n'), number: val('rg-no'), pin }); S.me = { id: r.player.id, pin, name: r.player.name }; LS.set('fcgn_me', S.me); modal(''); toast('Đăng ký xong! Chào mừng đến với FC Gì Nhỉ'); S.tab = 'home'; render(); break;
      }
      case 'logout': S.me = null; LS.del('fcgn_me'); render(); break;
      case 'adminLogin': modal(`<h3>Vào chế độ admin</h3><div class="f"><label>Mã admin</label><input class="in num" id="ad-c" type="password" inputmode="numeric"></div><div class="btns"><button class="btn gold full" data-a="doAdmin">Vào</button></div>`); break;
      case 'doAdmin': { const c = val('ad-c'); await act('adminLogin', { admin: c }); S.admin = c; LS.set('fcgn_admin', c); modal(''); toast('Đã vào chế độ admin ★'); render(); break; }
      case 'adminLogout': S.admin = ''; LS.del('fcgn_admin'); refresh(true); break;
      case 'guide': guideModal(); break;
      case 'match': matchModal(mid); break;
      case 'editMatch': matchForm(mid); break;
      case 'newMatch': matchForm(null); break;
      case 'saveMatch': await act('saveMatch', Object.assign(needAdmin(), { id: mid || '', date: val('mf-d'), time: val('mf-t'), opponent: val('mf-o'), place: val('mf-pl') }), 'Đã lưu'); modal(''); break;
      case 'cancel':
        if (v === '1' && !el.dataset.ok) { el.dataset.ok = 1; el.textContent = 'Bấm lần nữa để hủy'; el.style.color = 'var(--no)'; return; }
        await act('cancelMatch', Object.assign(needAdmin(), { id: mid, cancel: v === '1' }), v === '1' ? 'Đã hủy trận – không thu, không phạt' : 'Đã khôi phục trận'); modal(''); break;
      case 'delMatch':
        if (!el.dataset.ok) { el.dataset.ok = 1; el.textContent = 'Chắc chắn xóa? Bấm lần nữa'; return; }
        await act('deleteMatch', Object.assign(needAdmin(), { id: mid }), 'Đã xóa trận'); modal(''); break;
      case 'finalize': finalizeModal(mid); break;
      case 'stp': { const box = el.closest('.stp'), b = box.querySelector('b'); b.textContent = Math.max(box.id === 'cl-n' ? 1 : 0, (+b.textContent || 0) + (+el.dataset.d));
        if (box.id === 'cl-n') { const c = document.getElementById('cl-pre'); if (c) c.checked = true; claimSum(); } break; }
      case 'doFinalize': {
        const gv = id => +document.querySelector(`#${id} .stp b`).textContent;
        const scorers = [...document.querySelectorAll('#fz-sc .stp')].map(s => ({ key: s.dataset.k, count: +s.querySelector('b').textContent })).filter(s => s.count > 0);
        const ids = sel => [...document.querySelectorAll(sel + ' input:checked')].map(i => i.value);
        const gf = gv('fz-gf'), sum = scorers.reduce((s, x) => s + x.count, 0);
        if (sum > gf && !el.dataset.ok) { el.dataset.ok = 1; el.textContent = `Ghi bàn ${sum} > tỷ số ${gf}. Bấm lần nữa để vẫn lưu`; return; }
        const pay = document.querySelector('input[name="fz-pay"]:checked');
        await act('finalize', Object.assign(needAdmin(), { id: mid, gf, ga: gv('fz-ga'), scorers, absent: ids('#fz-ab'), extra: ids('#fz-ex'), fieldCost: (val('fz-fc') || '').replace(/\D/g, ''), fieldPayer: pay ? pay.value : 'duc' }), 'Đã lưu kết quả 🏁');
        modal(''); break;
      }
      case 'copyVote': copy(voteText(D().matches.find(x => x.id === mid))); break;
      case 'copySum': copy(sumText(D().matches.find(x => x.id === mid))); break;
      case 'copyTxt': copy(v); break;
      case 'qr': qrModal(v); break;
      case 'debt': debtModal(v); break;
      case 'markPaid': {
        const ids = [...document.querySelectorAll('.mdl input[type=checkbox]:checked')].map(i => i.value); if (!ids.length) return toast('Chưa tích khoản nào', true);
        await act('setPaid', Object.assign(needAdmin(), { ids, paid: true }), 'Đã ghi nhận ✓'); modal(''); break;
      }
      case 'dues': {
        if (!isAdmin()) return;
        const c = D().charges.find(x => x.id === v);
        modal(`<h3>${esc(pname(c.playerId))} · quỹ quý</h3><div class="mu sm">Trạng thái hiện tại: <b>${c.status === 'paid' ? 'Đã đóng' : c.status === 'void' ? 'Miễn' : 'Chưa đóng'}</b></div><div class="btns" style="flex-direction:column">
          ${c.status !== 'paid' && c.status !== 'void' ? `<button class="btn gold" data-a="duesSet" data-v="${c.id}" data-m="paid">✓ Đã đóng ${kmoney(c.amount)}</button>` : ''}
          ${c.status === 'paid' ? `<button class="btn" data-a="duesSet" data-v="${c.id}" data-m="unpaid">↺ Chuyển về chưa đóng</button>` : ''}
          ${c.status === 'unpaid' ? `<button class="btn" data-a="duesSet" data-v="${c.id}" data-m="exempt">Miễn quý này (nghỉ cả quý)</button>` : ''}
          ${c.status === 'void' ? `<button class="btn" data-a="duesSet" data-v="${c.id}" data-m="unexempt">↺ Bỏ miễn</button>` : ''}</div>`);
        break;
      }
      case 'duesSet': {
        const m = el.dataset.m;
        if (m === 'paid' || m === 'unpaid') await act('setPaid', Object.assign(needAdmin(), { ids: [v], paid: m === 'paid' }), 'Đã lưu');
        else await act('setExempt', Object.assign(needAdmin(), { id: v, exempt: m === 'exempt' }), 'Đã lưu');
        modal(''); break;
      }
      case 'txn': txnModal(); break;
      case 'doTxn': {
        const [kind, cat] = val('tx-k').split('|'); const h = document.querySelector('input[name="tx-h"]:checked').value;
        await act('addTxn', Object.assign(needAdmin(), { kind, cat, amount: (val('tx-a') || '').replace(/\D/g, ''), holder: h, date: val('tx-d'), note: val('tx-n') }), 'Đã lưu'); modal(''); break;
      }
      case 'delTxn':
        if (!el.dataset.ok) { el.dataset.ok = 1; el.textContent = 'Xóa?'; el.style.color = 'var(--no)'; return; }
        await act('delTxn', Object.assign(needAdmin(), { id: v }), 'Đã xóa'); break;
      case 'claim': claimModal(v); break;
      case 'doClaim': {
        const ids = [...document.querySelectorAll('#cl-list input:checked')].filter(i => !i.dataset.m).map(i => i.value);
        const matchIds = [...document.querySelectorAll('#cl-list input:checked')].filter(i => i.dataset.m).map(i => i.dataset.m);
        const topup = preAmt();
        await act('claim', { playerId: me().id, pin: me().pin, collector: v, chargeIds: ids, matchIds, topup, note: val('cl-note') }, 'Đã gửi – chờ admin xác nhận ⏳'); modal(''); break;
      }
      case 'cancelClaim': await act('cancelClaim', { playerId: me().id, pin: me().pin, id: v }, 'Đã hủy yêu cầu'); break;
      case 'approve': await act('approveClaim', { id: v }, 'Đã xác nhận nhận tiền ✓'); break;
      case 'reject':
        if (!el.dataset.ok) { el.dataset.ok = 1; el.textContent = 'Bấm lần nữa để từ chối'; el.style.color = 'var(--no)'; return; }
        await act('rejectClaim', { id: v }, 'Đã báo chưa thấy tiền'); break;
      case 'wallet': walletModal(v); break;
      case 'topup': topupModal(v); break;
      case 'doTopup': {
        const pid = val('tp-p'); if (!pid) return toast('Chọn thành viên', true);
        await act('topup', Object.assign(needAdmin(), { playerId: pid, amount: (val('tp-a') || '').replace(/\D/g, ''), date: val('tp-d'), note: val('tp-n') }), 'Đã nạp ví ✓'); walletModal(pid); break;
      }
      case 'delTopup': {
        if (!el.dataset.ok) { el.dataset.ok = 1; el.textContent = 'Xóa?'; el.style.color = 'var(--no)'; return; }
        const w = D().wallet.find(x => x.id === v); await act('delTopup', Object.assign(needAdmin(), { id: v }), 'Đã xóa lần nạp'); if (w) walletModal(w.playerId); break;
      }
      case 'settings': settingsModal(); break;
      case 'doSettings': {
        const values = {}; document.querySelectorAll('[id^="cf-"]').forEach(i => values[i.id.slice(3)] = i.value);
        await act('setConfig', Object.assign(needAdmin(), { values }), 'Đã lưu cài đặt'); modal(''); break;
      }
      case 'members': membersModal(); break;
      case 'member': memberForm(v); break;
      case 'doMember': await act('setPlayer', Object.assign(needAdmin(), { id: v, name: val('mb-n'), number: val('mb-no'), pin: val('mb-p'), active: document.getElementById('mb-a').checked, rest: document.getElementById('mb-r').checked ? (val('mb-rd') || '9999-12-31') : '' }), 'Đã lưu'); membersModal(); break;
      case 'merge': mergeModal(); break;
      case 'doMerge': {
        const s = document.querySelector(`select[data-merge="${CSS.escape(v)}"]`); if (!s.value) return toast('Chọn tài khoản để ghép', true);
        const r = await act('mergeName', Object.assign(needAdmin(), { name: v, playerId: s.value })); toast(`Đã ghép ${r.count} dòng bàn thắng`); mergeModal(); break;
      }
    }
  } catch (err) { /* đã báo lỗi bằng toast */ }
});
document.addEventListener('input', e => { if (e.target.id === 'cl-pre') claimSum(); });
document.addEventListener('change', e => {
  if (e.target.closest && (e.target.closest('#cl-list') || e.target.id === 'cl-pre')) claimSum();
  if (e.target.id === 'tx-k') { const t = e.target.value.startsWith('transfer'); document.getElementById('tx-hl').textContent = t ? 'Người chuyển đi' : 'Tiền ở tài khoản ai (người trả / người nhận)'; }
});
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (t && t !== S.tab && ['home', 'matches', 'money', 'stats', 'me'].includes(t)) { S.tab = t; render(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && D()) refresh(true); });

/* ===================== KHỞI ĐỘNG ===================== */
if (!DEMO) S.data = LS.get('fcgn_cache', null);
render();
refresh(true);
</script>
